# Why NumPy?

Python lists are **general-purpose** containers. NumPy arrays are **mathematical objects**.

<div style="display: flex; gap: 40px; margin-top: 20px;">
<div style="flex: 1;">

### 🐍 Pure Python

```python
# Adding two vectors (painful)
a = [1.0, 2.0]
b = [3.0, 4.0]
c = [a[0]+b[0], a[1]+b[1]]
# c = [4.0, 6.0]
```

- Loop-based, element by element
- No mathematical operations on lists
- `[1, 2] + [3, 4]` → `[1, 2, 3, 4]` 😱

</div>
<div style="flex: 1;">

### ⚡ NumPy

```python
import numpy as np

a = np.array([1.0, 2.0])
b = np.array([3.0, 4.0])
c = a + b
# c = array([4.0, 6.0])
```

- Vectorized: operates on **entire arrays**
- Written in C under the hood
- Mathematically natural syntax

</div>
</div>

```

<div style="display: flex; gap: 40px; margin-top: 10px;">

```

# Array Indexing & Slicing

<div style="display: flex; gap: 40px; margin-top: 10px;">
<div style="flex: 1;">

### Indexing

Access elements by index. Python uses **0-based indexing**, and negative indices count backwards.

```python
x = np.array([5, 0, 3, 7, 9])

x[0]  # returns 5
x[4]  # returns 9
x[-1] # returns 9
x[-2] # returns 7
```

:::nparray
[5, 0, 3, 7, 9]
:::

</div>
<div style="flex: 1;">

### Slicing

Use the `[start:stop:step]` syntax to access subarrays.

```python
x[0:3]  # First three: [5, 0, 3]
x[:3]   # Equivalent to x[0:3]
x[2:]   # From index 2 to end: [3, 7, 9]
x[::2]  # Every other element: [5, 3, 9]
```

### Multi-Dimensional

For 2D matrices, provide indices as `[row, col]`:

```python
M = np.array([[1, 2], [3, 4]])
M[0, 0] # Top-left: 1
M[:, 0] # First column: [1, 3]
```

</div>
</div>

# Universal Functions & Broadcasting

NumPy operations are vectorized, meaning they operate on whole arrays directly in compiled C code. 

<div style="display: flex; gap: 40px; margin-top: 10px;">
<div style="flex: 1;">

### Elementwise (ufuncs)

No loops required. Mathematical operations map directly over the arrays.

```python
a = np.array([2.0, 3.0])
b = np.array([4.0, 1.0])

c = a * b      # [8.0, 3.0]
d = a ** 2     # [4.0, 9.0]
e = np.sin(a)  # [0.909, 0.141]
```

</div>
<div style="flex: 1;">

### Broadcasting Rules

NumPy can operate on arrays of different shapes by "broadcasting" the smaller array across the larger one.

```python
v = np.array([1.0, 2.0, 3.0])

2.0 * v       # [2.0, 4.0, 6.0]
v + 10        # [11.0, 12.0, 13.0]
```

This makes parametrizing rays extremely succinct:
```python
point = origin + t * direction
```

</div>
</div>

# Advanced Indexing & Masking

When dealing with large sets of rays or intersection points, boolean masking allows for rapid filtering.

<div style="display: flex; gap: 40px; margin-top: 10px;">
<div style="flex: 1;">

### Fancy Indexing

You can pass arrays of indices to access multiple elements at once:

```python
x = np.arange(10, 20)
idx = np.array([2, 5, 8])

print(x[idx])
# [12, 15, 18]
```

</div>
<div style="flex: 1;">

### Boolean Masking

Operations return boolean arrays which can be used to filter data directly.

```python
# Suppose we have t_values for intersections
t = np.array([-1.2, 0.5, 3.1, -0.1])

# Keep only intersections IN FRONT of the ray
valid_t = t[t > 0]
# [0.5, 3.1]
```

</div>
</div>

# Sorting & Partitioning

Physics simulations often require finding the *closest* intersection point quickly.

<div style="display: flex; gap: 40px; margin-top: 10px;">
<div style="flex: 1;">

### argsort()

Returns the **indices** that would sort the array. Critical for keeping track of points.

```python
distances = np.array([5.5, 1.2, 3.4])

# Get indices from closest to furthest
order = np.argsort(distances)  
# [1, 2, 0]

closest_distance = distances[order[0]]
```

</div>
<div style="flex: 1;">

### partition()

If you only need the $k$-th smallest values (e.g. nearest neighbors) without sorting everything:

```python
x = np.array([7, 2, 3, 1, 6, 5, 4])

# Bring the 3 smallest to the front
np.partition(x, 3)
# [2, 1, 3, 4, 6, 5, 7]
```

</div>
</div>

---

# Structured Arrays

For complex optics, we sometimes need to bind heterogeneous data together tightly in memory, exactly like C-structs.

```python
# Define a memory layout:
# 'U10' = 10-char string, 'i4' = 32-bit int, 'f8' = 64-bit float
arr_type = np.dtype([('name', 'U10'), ('age', 'i4'), ('weight', 'f8')])

data = np.zeros(4, dtype=arr_type)

data['name'] = ['Alice', 'Bob', 'Cathy', 'Doug']
data['age'] = [25, 45, 37, 19]

# Masking on structures
print(data[data['age'] < 30]['name'])
# ['Alice' 'Doug']
```
