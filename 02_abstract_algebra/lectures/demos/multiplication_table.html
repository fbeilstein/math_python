<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multiplication Table Explorer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
.sidebar {
    width: 220px; background: #161b22; padding: 14px; display: flex; flex-direction: column; gap: 10px;
    border-right: 1px solid #30363d; overflow-y: auto;
}
.sidebar h2 { color: #58a6ff; font-size: 15px; }
.sidebar label { font-size: 11px; color: #8b949e; display: block; margin-bottom: 3px; }
.sidebar select, .sidebar input {
    width: 100%; padding: 5px 7px; background: #0d1117; border: 1px solid #30363d;
    color: #c9d1d9; border-radius: 4px; font-size: 12px;
}
.sidebar button {
    padding: 7px; background: #238636; color: white; border: none; border-radius: 5px;
    font-weight: bold; cursor: pointer; font-size: 12px;
}
.sidebar button:hover { background: #2ea043; }
.info { font-size: 11px; color: #8b949e; line-height: 1.5; border-top: 1px solid #30363d; padding-top: 8px; margin-top: 4px; }
.info strong { color: #58a6ff; }
.main { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 20px; }
table { border-collapse: collapse; }
td, th {
    width: 42px; height: 38px; text-align: center; font-size: 13px; font-weight: 600;
    border: 1px solid #30363d; cursor: pointer; transition: all 0.15s;
}
th { background: #21262d; color: #58a6ff; }
td.highlight-row, td.highlight-col { outline: 2px solid #ffa657; z-index: 1; position: relative; }
td.highlight-cell { outline: 3px solid #ffd700; z-index: 2; position: relative; }
.legend { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.legend-item { font-size: 10px; padding: 2px 6px; border-radius: 3px; }
</style>
</head>
<body>
<div class="sidebar">
    <h2>Multiplication Table</h2>
    <div>
        <label>Group</label>
        <select id="group">
            <option value="Zn_add">ℤₙ (addition)</option>
            <option value="Zn_mul">ℤₙ (multiplication)</option>
            <option value="Un">U(n) (multiplicative)</option>
            <option value="Dn" selected>Dₙ (dihedral)</option>
        </select>
    </div>
    <div>
        <label>n</label>
        <input id="n" type="number" value="3" min="2" max="8">
    </div>
    <button onclick="generate()">Generate</button>
    <div class="info" id="info">
        <strong>Order:</strong> —<br>
        <strong>Abelian:</strong> —<br>
        <strong>Cyclic:</strong> —
    </div>
    <div class="info">
        Click any cell to highlight<br>its row and column.
        <div class="legend" id="legend"></div>
    </div>
</div>
<div class="main"><div id="table-container"></div></div>

<script>
function mod(a, n) { return ((a % n) + n) % n; }

function sup(k) {
    const s = '⁰¹²³⁴⁵⁶⁷⁸⁹';
    return String(k).split('').map(c => s[+c]).join('');
}

function generateGroup() {
    const type = document.getElementById('group').value;
    const n = parseInt(document.getElementById('n').value);
    let elems, labels, op, abelian = true, cyclic = false;

    if (type === 'Zn_add') {
        elems = Array.from({length: n}, (_, i) => i);
        labels = elems.map(String);
        op = (a, b) => mod(a + b, n);
        abelian = true; cyclic = true;
    } else if (type === 'Zn_mul') {
        elems = Array.from({length: n}, (_, i) => i);
        labels = elems.map(String);
        op = (a, b) => mod(a * b, n);
        abelian = true; cyclic = false;
    } else if (type === 'Un') {
        elems = [];
        for (let k = 1; k < n; k++) { if (gcd(k, n) === 1) elems.push(k); }
        labels = elems.map(String);
        op = (a, b) => mod(a * b, n);
        abelian = true;
        // Check cyclic
        const m = elems.length;
        cyclic = elems.some(g => { let v = 1; for (let i = 0; i < m; i++) { v = mod(v * g, n); } return v === 1 && orderOf(g, n, m) === m; });
    } else if (type === 'Dn') {
        // Elements: (k, f) where k in [0,n), f in {0,1}
        elems = [];
        labels = [];
        for (let f = 0; f < 2; f++) for (let k = 0; k < n; k++) {
            elems.push([k, f]);
            if (f === 0) labels.push(k === 0 ? 'e' : (k === 1 ? 'r' : 'r' + sup(k)));
            else labels.push(k === 0 ? 's' : 'sr' + (k === 1 ? '' : sup(k)));
        }
        op = (a, b) => {
            const k = mod(a[0] + (a[1] ? -b[0] : b[0]), n);
            const f = a[1] ^ b[1];
            return elems.find(e => e[0] === k && e[1] === f);
        };
        abelian = n <= 2;
        cyclic = false;
    }
    return { elems, labels, op, abelian, cyclic, order: elems.length };
}

function gcd(a, b) { while (b) { [a, b] = [b, a % b]; } return a; }

function orderOf(g, n, maxOrd) {
    let v = 1;
    for (let i = 1; i <= maxOrd; i++) { v = mod(v * g, n); if (v === 1) return i; }
    return maxOrd;
}

function elemIdx(elems, e) {
    if (Array.isArray(e)) return elems.findIndex(x => Array.isArray(x) && x[0] === e[0] && x[1] === e[1]);
    return elems.indexOf(e);
}

const COLORS = ['#58a6ff','#7ee787','#ffa657','#d2a8ff','#ff7b72','#79c0ff','#f0e68c','#ff69b4',
                '#a5d6ff','#aff5b4','#ffd8b1','#e8daff','#ffc0c0','#b6e3ff','#fff9a6','#ffb3da'];

function generate() {
    const { elems, labels, op, abelian, cyclic, order } = generateGroup();
    const container = document.getElementById('table-container');

    // Build table
    let html = '<table><tr><th>·</th>';
    for (const l of labels) html += `<th>${l}</th>`;
    html += '</tr>';

    const results = [];
    for (let i = 0; i < order; i++) {
        html += `<tr><th>${labels[i]}</th>`;
        const row = [];
        for (let j = 0; j < order; j++) {
            const result = op(elems[i], elems[j]);
            const idx = elemIdx(elems, result);
            row.push(idx);
            const c = COLORS[idx % COLORS.length];
            const r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16);
            const bg = `rgb(${r/4|0},${g/4|0},${b/4|0})`;
            html += `<td data-r="${i}" data-c="${j}" style="background:${bg};color:${c}">${labels[idx]}</td>`;
        }
        results.push(row);
        html += '</tr>';
    }
    html += '</table>';
    container.innerHTML = html;

    // Click highlighting
    container.querySelectorAll('td').forEach(td => {
        td.addEventListener('click', () => {
            container.querySelectorAll('td').forEach(t => t.className = '');
            const r = td.dataset.r, c = td.dataset.c;
            container.querySelectorAll(`td[data-r="${r}"]`).forEach(t => t.classList.add('highlight-row'));
            container.querySelectorAll(`td[data-c="${c}"]`).forEach(t => t.classList.add('highlight-col'));
            td.className = 'highlight-cell';
        });
    });

    // Check for zero divisors (for multiplicative tables)
    const type = document.getElementById('group').value;
    let hasZeroDivisors = false;
    if (type === 'Zn_mul') {
        for (let i = 1; i < order; i++) for (let j = 1; j < order; j++) {
            if (results[i][j] === 0) { hasZeroDivisors = true; break; }
        }
    }

    // Info
    let infoHtml = `<strong>Order:</strong> ${order}<br><strong>Abelian:</strong> ${abelian ? 'Yes' : 'No'}<br><strong>Cyclic:</strong> ${cyclic ? 'Yes' : 'No'}`;
    if (type === 'Zn_mul') infoHtml += `<br><strong>Zero divisors:</strong> <span style="color:${hasZeroDivisors?'#ff7b72':'#7ee787'}">${hasZeroDivisors ? 'Yes' : 'No'}</span>`;
    document.getElementById('info').innerHTML = infoHtml;

    // Legend
    const legend = document.getElementById('legend');
    legend.innerHTML = labels.map((l, i) =>
        `<span class="legend-item" style="background:${COLORS[i%COLORS.length]}22;color:${COLORS[i%COLORS.length]}">${l}</span>`
    ).join('');
}

generate();
</script>
</body>
</html>
