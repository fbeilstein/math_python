<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
    <style>
        .point-0 { fill: #ec4899; }
        .text-0 { fill: #ec4899; font-family: sans-serif; font-size: 18px; text-anchor: middle; font-weight: bold; }
        
        .point-1 { fill: #22c55e; }
        .line-1 { stroke: #22c55e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .text-1 { fill: #22c55e; font-family: sans-serif; font-size: 18px; text-anchor: middle; font-weight: bold; }
        
        .point-2 { fill: #3b82f6; }
        .line-2 { stroke: #3b82f6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .fill-2 { fill: rgba(59, 130, 246, 0.4); }
        .text-2 { fill: #3b82f6; font-family: sans-serif; font-size: 18px; text-anchor: middle; font-weight: bold; }
        
        .point-3 { fill: #a855f7; }
        .line-3 { stroke: #a855f7; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .dashed-3 { stroke: #a855f7; stroke-width: 2; stroke-dasharray: 6,6; stroke-linecap: round; opacity: 0.7; }
        .fill-3 { fill: rgba(168, 85, 247, 0.3); }
        .text-3 { fill: #a855f7; font-family: sans-serif; font-size: 18px; text-anchor: middle; font-weight: bold; }
        
        .label { fill: #9ca3af; font-family: sans-serif; font-size: 14px; text-anchor: middle; font-style: italic; }
    </style>

    <!-- 0-simplex -->
    <circle cx="100" cy="110" r="5" class="point-0" />
    <text x="100" y="180" class="text-0">0-simplex</text>
    <text x="100" y="200" class="label">Vertex</text>

    <!-- 1-simplex -->
    <line x1="250" y1="110" x2="350" y2="110" class="line-1" />
    <circle cx="250" cy="110" r="5" class="point-1" />
    <circle cx="350" cy="110" r="5" class="point-1" />
    <text x="300" y="180" class="text-1">1-simplex</text>
    <text x="300" y="200" class="label">Edge</text>

    <!-- 2-simplex -->
    <path d="M 450 140 L 550 140 L 500 50 Z" class="fill-2 line-2" />
    <circle cx="450" cy="140" r="5" class="point-2" />
    <circle cx="550" cy="140" r="5" class="point-2" />
    <circle cx="500" cy="50" r="5" class="point-2" />
    <text x="500" y="180" class="text-2">2-simplex</text>
    <text x="500" y="200" class="label">Triangle</text>

    <!-- 3-simplex -->
    <!-- Back face fill -->
    <path d="M 640 140 L 710 100 L 700 40 Z" class="fill-3" />
    <path d="M 760 140 L 710 100 L 700 40 Z" class="fill-3" />
    <!-- Front face fill -->
    <path d="M 640 140 L 760 140 L 700 40 Z" class="fill-3" />
    
    <!-- Dashed back edges -->
    <line x1="640" y1="140" x2="710" y2="100" class="dashed-3" />
    <line x1="760" y1="140" x2="710" y2="100" class="dashed-3" />
    <line x1="710" y1="100" x2="700" y2="40" class="dashed-3" />
    
    <!-- Solid front edges -->
    <line x1="640" y1="140" x2="760" y2="140" class="line-3" />
    <line x1="640" y1="140" x2="700" y2="40" class="line-3" />
    <line x1="760" y1="140" x2="700" y2="40" class="line-3" />
    
    <!-- Points -->
    <circle cx="640" cy="140" r="5" class="point-3" />
    <circle cx="760" cy="140" r="5" class="point-3" />
    <circle cx="710" cy="100" r="5" class="point-3" />
    <circle cx="700" cy="40" r="5" class="point-3" />
    
    <text x="700" y="180" class="text-3">3-simplex</text>
    <text x="700" y="200" class="label">Tetrahedron</text>
</svg>
