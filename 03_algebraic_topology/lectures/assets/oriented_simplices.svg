<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
    <style>
        .point-1 { fill: #22c55e; }
        .line-1 { stroke: #22c55e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .text-1 { fill: #22c55e; font-family: sans-serif; font-size: 18px; text-anchor: middle; font-weight: bold; }
        
        .point-2 { fill: #3b82f6; }
        .line-2 { stroke: #3b82f6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .fill-2 { fill: rgba(59, 130, 246, 0.4); }
        .text-2 { fill: #3b82f6; font-family: sans-serif; font-size: 18px; text-anchor: middle; font-weight: bold; }
        
        .label { fill: #9ca3af; font-family: sans-serif; font-size: 14px; text-anchor: middle; font-style: italic; }
    </style>

    <!-- 1-simplex [a, b] -->
    <g transform="translate(100, 0)">
        <line x1="100" y1="100" x2="250" y2="100" class="line-1" />
        <!-- Arrowhead in middle pointing right -->
        <path d="M 165 90 L 180 100 L 165 110" fill="none" class="line-1" />
        
        <circle cx="100" cy="100" r="5" class="point-1" />
        <text x="80" y="105" class="text-1">a</text>
        
        <circle cx="250" cy="100" r="5" class="point-1" />
        <text x="270" y="105" class="text-1">b</text>
        
        <text x="175" y="160" class="text-1">[a, b]</text>
        <text x="175" y="180" class="label">Points from a to b</text>
    </g>

    <!-- 2-simplex [a, b, c] -->
    <g transform="translate(100, 0)">
        <path d="M 400 140 L 550 140 L 475 40 Z" class="fill-2 line-2" />
        
        <!-- Circular CCW arrow in center -->
        <!-- Center ~ (475, 100), radius 20 -->
        <!-- Start at right (495, 100), 270-degree CCW arc to bottom (475, 120) -->
        <path d="M 495 100 A 20 20 0 1 0 475 120" fill="none" class="line-2" />
        <!-- Arrowhead at (475, 120) pointing right -->
        <path d="M 460 110 L 475 120 L 460 130" fill="none" class="line-2" />
        
        <circle cx="400" cy="140" r="5" class="point-2" />
        <text x="380" y="145" class="text-2">a</text>
        
        <circle cx="550" cy="140" r="5" class="point-2" />
        <text x="570" y="145" class="text-2">b</text>
        
        <circle cx="475" cy="40" r="5" class="point-2" />
        <text x="475" y="25" class="text-2">c</text>
        
        <text x="475" y="180" class="text-2">[a, b, c]</text>
        <text x="475" y="200" class="label">Counter-clockwise circulation</text>
    </g>
</svg>
