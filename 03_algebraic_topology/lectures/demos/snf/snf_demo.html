<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smith Normal Form Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Courier+New:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="setup-panel">
        <label>Rows: <input type="number" id="input-rows" value="3" min="1" max="6"></label>
        <label>Cols: <input type="number" id="input-cols" value="3" min="1" max="6"></label>
        <button onclick="resizeGrid()">Set Size</button>
        <button onclick="randomizeGrid()">Randomize</button>
        <button onclick="loadTriangleD1()">Load Triangle D₁</button>
        <button id="btn-solve" onclick="startSolve()" class="primary">Compute SNF</button>
    </div>

    <div id="status-msg">Enter a matrix or load an example, then click Compute.</div>

    <div class="matrix-container" id="matrix">
        <!-- Cells generated by JS -->
    </div>

    <div class="controls" id="playback-controls" style="display: none;">
        <button id="btn-prev" onclick="prevStep()">◀ Prev</button>
        <button id="btn-next" onclick="nextStep()" class="primary">Next ▶</button>
        <button id="btn-reset" onclick="resetDemo()">Edit Matrix</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
